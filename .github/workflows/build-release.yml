
name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\ZarExplorer.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build .\ZarExplorer.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $env:RUNNER_TEMP "ZarExplorer-publish"

          dotnet publish .\ZarExplorer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --no-restore `
            -o $publishDir

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          }
          else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }

          $publishDir = Join-Path $env:RUNNER_TEMP "ZarExplorer-publish"
          $stageDir = Join-Path $env:RUNNER_TEMP "ZarExplorer-package"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"

          if (-not (Test-Path $publishDir)) {
            throw "Published application directory not found."
          }

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item -Path (Join-Path $publishDir "*") `
            -Destination $stageDir -Recurse -Force

          Copy-Item -Path @(
            "README.md",
            "LICENSE",
            "THIRD-PARTY-NOTICES.md"
          ) -Destination $stageDir -Force

          $dependencyBase = "https://raw.githubusercontent.com/purelogiccode/ZArchiveSharp/v1.4.0"

          Invoke-WebRequest `
            -Uri "$dependencyBase/LICENSE" `
            -OutFile (Join-Path $stageDir "ZArchiveSharp-LICENSE.txt")

          Invoke-WebRequest `
            -Uri "$dependencyBase/THIRD-PARTY-NOTICES.md" `
            -OutFile (Join-Path $stageDir "ZArchiveSharp-THIRD-PARTY-NOTICES.md")

          $zipName = "ZarExplorer-win-x64-$version.zip"
          $zipPath = Join-Path $artifactDir $zipName

          Compress-Archive `
            -Path (Join-Path $stageDir "*") `
            -DestinationPath $zipPath `
            -Force

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          Set-Content `
            -LiteralPath "$zipPath.sha256" `
            -Value "$hash  $zipName" `
            -Encoding ascii

          Write-Host "Created $zipName"
          Write-Host "SHA-256: $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZarExplorer-build-${{ github.run_id }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ZarExplorer-build-${{ github.run_id }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ZAR Explorer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.zip
            release-assets/*.sha256
